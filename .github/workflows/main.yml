name: Viam Trajex CI Pipeline

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches:
      - '**'
  release:
    types: [published]
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC daily (6 AM EDT / 5 AM EST)
    - cron: '0 10 * * 0'  # 10 AM UTC every Sunday (weekly unconditional run)

jobs:
  check-recent-commits:
    name: Check for Recent Commits
    runs-on: ubuntu-latest
    outputs:
      has_recent_commits: ${{ steps.check.outputs.has-new-commits || steps.tag-fallback.outputs.has-new-commits }}
    steps:
      - name: Check if building from tag
        id: tag-fallback
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Building from tag, skipping recent commits check"
          echo "has-new-commits=false" >> $GITHUB_OUTPUT

      - name: Check for commits in last 24 hours
        id: check
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: adriangl/check-new-commits-action@6556947ca20c2047ed733894258186619b84d282
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          seconds: 86400

  build-test-lint:
    name: Build, Test, and Lint
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/viam-modules/universal-robots@${{ matrix.container_digest }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
          container_digest: sha256:b2edd28b4f1a17ff48c286216df137cb6e79b85abcd46f9580c5d7caca1591a8
        - arch: arm64
          runner: ubuntu-4cpu-arm
          container_digest: sha256:e3c6365b7caafb9faf59aef628a6560e23fea137eeb564983365de96fe2e2dfe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Configure
        run: make -f .github/scripts/Makefile configure
      - name: Format
        run: make -f .github/scripts/Makefile format-check
      - name: Check Check
        run: make -f .github/scripts/Makefile run-clang-check
      - name: Check Tidy
        run: make -f .github/scripts/Makefile run-clang-tidy-parallel
      - name: Build
        run: make -f .github/scripts/Makefile build
      - name: Verify Headers
        run: make -f .github/scripts/Makefile verify-headers
      - name: Test
        run: make -f .github/scripts/Makefile test
      - name: Verify Package
        run: make -f .github/scripts/Makefile verify-package

  build-release-artifacts:
    name: Build Trajex Release Artifacts
    needs: [check-recent-commits, build-test-lint]
    # Same triggers as UR: tags, manual dispatch, or scheduled builds
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       (needs.check-recent-commits.outputs.has_recent_commits == 'true' ||
        github.event.schedule == '0 10 * * 0'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds in the C++ SDK's conan image, which ships conan, gcc 11,
          # and a default conan profile. Jammy keeps the module's glibc
          # requirement low enough to run on Jammy, Bookworm, and newer. Pinned
          # to a dated tag so the release toolchain only changes deliberately;
          # keep etc/conan/linux.profile in sync when bumping it.
          - platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy-2026-11.00
            artifact_name: trajex-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-4cpu-arm
            container: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy-2026-11.00
            artifact_name: trajex-linux-arm64
          # macOS native build. Pinned to the runner the C++ SDK publishes its
          # macOS binaries from, so the Xcode (apple-clang) version matches
          # etc/conan/macos.profile and the prebuilt binaries are used.
          - platform: darwin/arm64
            runner: macos-26
            artifact_name: trajex-darwin-arm64

    # Container is only populated for Linux builds
    container: ${{ matrix.container }}

    steps:
      - name: Install Conan (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install conan
          conan profile detect

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup C++ SDK for Trajex
        run: ./bin/setup.sh

      - name: Build Trajex module
        run: ./bin/build.sh

      - name: Attach build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: module.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish Trajex to Viam Module Registry
    needs: [build-release-artifacts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            artifact_name: trajex-linux-amd64
          - platform: linux/arm64
            artifact_name: trajex-linux-arm64
          - platform: darwin/arm64
            artifact_name: trajex-darwin-arm64

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}

      - name: Extract meta.json from module archive
        run: tar -xzf module.tar.gz meta.json

      - name: Upload trajex module to Viam
        uses: viamrobotics/upload-module@v1
        with:
          module-path: module.tar.gz
          platform: ${{ matrix.platform }}
          version: ${{ github.ref_name }}
          key-id: ${{ secrets.VIAM_DEV_API_KEY_ID }}
          key-value: ${{ secrets.VIAM_DEV_API_KEY }}
          do-update: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
          do-upload: ${{ github.event_name == 'release' }}
