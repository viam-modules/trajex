# Two OMPL planning pipelines for the Panda, each timed by one of the trajex response adapters. They're laid out the
# way move_group expects, with everything for a pipeline, adapter parameters included, under the pipeline's name.
# Each sets an output rate different from MoveIt's default, so the test can tell which adapter timed the plan.
/**:
  ros__parameters:
    ompl_trajex:
      planning_plugins:
        - ompl_interface/OMPLPlanner
      response_adapters:
        - viam_trajex_moveit/AddTotgTimeParameterization
      trajex:
        totg:
          sampling:
            frequency: 37.0
      planner_configs:
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.0
      panda_arm:
        planner_configs:
          - RRTConnectkConfigDefault

    ompl_trajex_compat:
      planning_plugins:
        - ompl_interface/OMPLPlanner
      response_adapters:
        - viam_trajex_moveit/AddTotgTimeParameterizationCompat
      totg:
        resample_dt: 0.05
      planner_configs:
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.0
      panda_arm:
        planner_configs:
          - RRTConnectkConfigDefault
